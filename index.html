<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hitster">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<title>Hitster Thuis</title>
<style>
:root{
  --bg:#0e0a1f; --panel:#1a1433; --panel2:#241b45; --line:#3a2f66;
  --text:#f5f2ff; --muted:#a59bc9; --accent:#ff3d9a; --accent2:#00e5ff;
  --good:#3dff9a; --bad:#ff4d5e; --gold:#ffd23f;
  --r:18px;
  --head:'Unbounded', ui-rounded, system-ui, sans-serif;
  --body:'Inter', -apple-system, system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;min-height:100%}
body{
  background:
    radial-gradient(900px 500px at 110% -10%, rgba(255,61,154,.22), transparent 60%),
    radial-gradient(700px 500px at -20% 30%, rgba(0,229,255,.14), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  overscroll-behavior-y:none;
}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 120px)}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}
h2{font-size:22px;margin-bottom:12px}
h3{font-size:15px;margin-bottom:8px}
p{line-height:1.5;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
a{color:var(--accent2)}
.logo{font-family:var(--head);font-weight:800;font-size:44px;line-height:.95;margin:18px 0 6px;
  background:linear-gradient(90deg,var(--accent),#b26bff 50%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{display:block;font-size:18px;letter-spacing:.3em;color:var(--text);-webkit-text-fill-color:var(--text);opacity:.85;margin-top:6px}
.panel{background:rgba(26,20,51,.85);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0;backdrop-filter:blur(6px)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font:600 16px var(--body);color:var(--text);
  background:var(--panel2);border:1px solid var(--line);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.primary{background:linear-gradient(135deg,var(--accent),#b26bff);border:0;box-shadow:0 8px 24px rgba(255,61,154,.3)}
.btn.cyan{background:linear-gradient(135deg,#00b8d4,#4d7cff);border:0}
.btn.good{background:linear-gradient(135deg,#1fcf7a,#00b8d4);border:0;color:#04120b}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
input[type=text],input[type=number],input[type=search]{width:100%;font:16px var(--body);color:var(--text);background:#120d27;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus{border-color:var(--accent2)}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
code.box{display:block;word-break:break-all;background:#120d27;border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--accent2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.ok{color:var(--good)} .err{color:var(--bad)}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c2,var(--gold) 55%,#c99a00);box-shadow:0 0 6px rgba(255,210,63,.6);vertical-align:-2px}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.topbar h2{margin:0;flex:1;font-size:18px}
/* toggle */
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:99px;transition:.2s}
.switch span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper b{font-family:var(--head);font-size:22px;min-width:36px;text-align:center}
/* standings */
.scores{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 10px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.scores::-webkit-scrollbar{display:none}
.score{flex:none;padding:8px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:13px;min-width:86px}
.score.me{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.score b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.score .n{font-family:var(--head);font-size:18px}
/* cards */
.song{--c:#888;position:relative;display:flex;align-items:stretch;border-radius:16px;overflow:hidden;min-height:64px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 26%,var(--panel)),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.song .yr{flex:none;width:86px;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:800;font-size:22px;color:#0e0a1f;background:var(--c)}
.song .info{padding:10px 12px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.song .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song.new{animation:pop .5s ease}
.song.mys{--c:var(--accent);background:repeating-linear-gradient(135deg,#2a1d55 0 10px,#22184a 10px 20px);border:2px solid var(--accent);box-shadow:0 0 18px rgba(255,61,154,.45)}
.song.mys .yr{background:linear-gradient(135deg,var(--accent),#b26bff);color:#fff;font-size:28px}
.song.chal{border:2px dashed var(--gold);background:rgba(255,210,63,.08)}
.song.chal .yr{background:var(--gold);font-size:14px;padding:4px;text-align:center;line-height:1.1}
.song.wrong{opacity:.55}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.tl{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.slot{appearance:none;width:100%;border:2px dashed var(--line);background:transparent;color:var(--muted);border-radius:12px;min-height:38px;font:600 14px var(--body);cursor:pointer}
.slot:active{background:rgba(255,255,255,.04)}
.slot.taken{border-color:var(--gold);color:var(--gold)}
.slot.hot{border-color:var(--accent2);color:var(--accent2)}
.tl-end{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.15em;text-transform:uppercase;margin:4px 0}
/* mystery hero */
.hero{border-radius:22px;padding:18px;text-align:center;background:linear-gradient(160deg,#2b1b5c,#170f34);border:1px solid var(--line);position:relative;overflow:hidden}
.hero .q{font-family:var(--head);font-size:64px;font-weight:800;line-height:1;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.eq{display:flex;gap:4px;justify-content:center;height:28px;align-items:flex-end;margin:10px 0}
.eq i{width:6px;border-radius:3px;background:var(--accent2);animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s;background:var(--accent)}
.eq i:nth-child(3){animation-delay:.4s}
.eq i:nth-child(4){animation-delay:.1s;background:#b26bff}
.eq i:nth-child(5){animation-delay:.3s}
.eq.off i{animation:none;height:6px}
@keyframes eq{0%,100%{height:6px}50%{height:28px}}
/* reveal */
.flip{perspective:900px}
.flip .face{animation:flipin .7s cubic-bezier(.2,.8,.2,1)}
@keyframes flipin{0%{transform:rotateY(90deg)}100%{transform:none}}
.big{--c:#888;border-radius:24px;padding:20px;text-align:center;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 35%,var(--panel)),var(--panel));border:2px solid var(--c)}
.big img{width:160px;height:160px;border-radius:14px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.big .noimg{width:160px;height:160px;border-radius:14px;margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--c);color:#0e0a1f;font-family:var(--head);font-size:40px}
.big .y{font-family:var(--head);font-weight:800;font-size:56px;line-height:1;margin:14px 0 6px;color:var(--c)}
.big .t{font-weight:700;font-size:20px}
.big .a{color:var(--muted)}
.verdict{font-family:var(--head);font-size:26px;text-align:center;margin:14px 0 4px}
/* bottom bar */
.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(180deg,transparent,rgba(14,10,31,.95) 30%);z-index:5}
.bottom .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
/* library */
.lib-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lib-row img,.lib-row .ph{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--panel2)}
.lib-row.off{opacity:.45}
.lib-row input[type=number]{width:84px;padding:8px;text-align:center;font-weight:700}
.lib-row input.changed{border-color:var(--gold);color:var(--gold)}
.chk{width:26px;height:26px;accent-color:var(--accent);flex:none}
/* modal + toast */
#modal{position:fixed;inset:0;z-index:20;display:none;background:rgba(5,3,14,.7);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#modal .sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%) translateY(calc(-100% - 60px));visibility:hidden;z-index:30;background:var(--panel2);border:1px solid var(--line);padding:12px 16px;border-radius:14px;max-width:92vw;transition:transform .25s;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
#toast.err{border-color:var(--bad)}
.handoff{min-height:70vh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:16px}
.handoff .who{font-family:var(--head);font-size:40px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-word}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.rules li{margin-bottom:8px;line-height:1.45}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   CONFIG — vul hier je Spotify Client ID in (of doe het in de app)
   ========================================================= */
const CONFIG = {
  CLIENT_ID: '',                       // bijv. 'a1b2c3d4e5...'
  REDIRECT_URI: location.origin + location.pathname, // moet exact zo in het Spotify Dashboard staan
  SCOPES: 'playlist-read-private playlist-read-collaborative user-read-playback-state user-modify-playback-state',
};
const API = 'https://api.spotify.com/v1';

/* ---------- opslag ---------- */
const K = {auth:'hs_auth', cid:'hs_client_id', pkce:'hs_pkce', lib:'hs_library', ov:'hs_overrides', game:'hs_game', set:'hs_settings', dev:'hs_device', names:'hs_names'};
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const del = k => { try { localStorage.removeItem(k); } catch {} };

let lib = load(K.lib, null);           // {source:'spotify'|'demo', playlistId, name, tracks:[]}
let ov = load(K.ov, {});               // {trackId:{year, excluded}}
let game = load(K.game, null);
let settings = Object.assign({target:10, tokens:true, startTokens:2}, load(K.set, {}));
let me = null;                          // spotify profiel
let ui = {screen:'home', libQuery:'', libFilter:'all', pendingChallenger:null};

const clientId = () => CONFIG.CLIENT_ID || load(K.cid, '');

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => Math.floor(a + Math.random() * (b - a));
function toast(msg, isErr) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = isErr ? 'err' : '', isErr ? 5000 : 2600);
}
function decColor(y) {
  const d = Math.floor((y || 0) / 10) * 10;
  return ({1950:'#ff9f43',1960:'#ffd23f',1970:'#a3ff3d',1980:'#ff3d9a',1990:'#00e5ff',2000:'#b26bff',2010:'#5b8cff',2020:'#ff6b6b'})[d] || (d < 1950 ? '#ff9f43' : '#ff6b6b');
}
const coins = n => `<span class="pill"><span class="coin"></span> ${n}</span>`;

/* ---------- bibliotheek ---------- */
function trackMap() { if (!trackMap._c || trackMap._lib !== lib) { trackMap._c = new Map((lib?.tracks || []).map(t => [t.id, t])); trackMap._lib = lib; } return trackMap._c; }
const T = id => trackMap().get(id);
function yearOf(t) { if (typeof t === 'string') t = T(t); if (!t) return 0; const o = ov[t.id]; return (o && o.year) || t.year || 0; }
const isExcluded = t => !!(ov[t.id] && ov[t.id].excluded);
const playable = () => (lib?.tracks || []).filter(t => !isExcluded(t) && yearOf(t));

function setOverride(id, patch) {
  const t = T(id); const o = Object.assign({}, ov[id], patch);
  if (o.year && t && +o.year === +t.year) delete o.year;
  if (!o.excluded) delete o.excluded;
  if (Object.keys(o).length) ov[id] = o; else delete ov[id];
  save(K.ov, ov);
}

/* =========================================================
   SPOTIFY AUTH (PKCE, geen backend)
   ========================================================= */
function randStr(n) {
  const cs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const v = crypto.getRandomValues(new Uint8Array(n)); return Array.from(v, x => cs[x % cs.length]).join('');
}
async function challengeOf(v) {
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function login() {
  if (!clientId()) return toast('Vul eerst je Spotify Client ID in.', true);
  const verifier = randStr(64);
  save(K.pkce, verifier);
  // Het verifier gaat óók mee in 'state': op iOS komt de terugsprong soms in een andere
  // browsercontext terecht (beginscherm-app vs. Safari) waar localStorage leeg is.
  const state = randStr(12) + '_' + verifier;
  const p = new URLSearchParams({
    response_type: 'code', client_id: clientId(), scope: CONFIG.SCOPES,
    redirect_uri: CONFIG.REDIRECT_URI, code_challenge_method: 'S256',
    code_challenge: await challengeOf(verifier), state,
  });
  location.href = 'https://accounts.spotify.com/authorize?' + p;
}
async function handleCallback() {
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return;
  history.replaceState(null, '', location.pathname);
  if (q.get('error')) return toast('Inloggen geannuleerd: ' + q.get('error'), true);
  const verifier = load(K.pkce, null) || (q.get('state') || '').split('_')[1];
  if (!verifier) return toast('Inloggen mislukt (geen verifier). Probeer opnieuw.', true);
  try {
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({grant_type: 'authorization_code', code: q.get('code'), redirect_uri: CONFIG.REDIRECT_URI, client_id: clientId(), code_verifier: verifier}),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.error || r.status);
    storeToken(j); del(K.pkce); toast('Ingelogd bij Spotify ✓');
  } catch (e) { toast('Inloggen mislukt: ' + e.message, true); }
}
function storeToken(j) {
  const old = load(K.auth, {});
  save(K.auth, {access: j.access_token, refresh: j.refresh_token || old.refresh, exp: Date.now() + (j.expires_in || 3600) * 1000});
}
async function refreshToken() {
  const a = load(K.auth, null); if (!a?.refresh) throw new Error('Niet ingelogd');
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({grant_type: 'refresh_token', refresh_token: a.refresh, client_id: clientId()}),
  });
  const j = await r.json();
  if (!r.ok) { del(K.auth); throw new Error('Sessie verlopen, log opnieuw in.'); }
  storeToken(j);
}
async function token() {
  const a = load(K.auth, null); if (!a) throw new Error('Niet ingelogd bij Spotify');
  if (Date.now() > a.exp - 60000) await refreshToken();
  return load(K.auth).access;
}
const loggedIn = () => !!load(K.auth, null);
async function api(path, opts = {}, retry = true) {
  const r = await fetch(API + path, {
    method: opts.method || 'GET',
    headers: {Authorization: 'Bearer ' + await token(), ...(opts.body ? {'Content-Type': 'application/json'} : {})},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (r.status === 401 && retry) { await refreshToken(); return api(path, opts, false); }
  if (r.status === 204 || r.status === 202) return null;
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch {}
  if (!r.ok) { const e = new Error(j?.error?.message || ('HTTP ' + r.status)); e.status = r.status; e.reason = j?.error?.reason; throw e; }
  return j;
}
function logout() { del(K.auth); me = null; render(); }

/* ---------- playlist ---------- */
function parsePlaylistId(s) {
  s = (s || '').trim();
  const m = s.match(/playlist[/:]([A-Za-z0-9]{22})/) || s.match(/^([A-Za-z0-9]{22})$/);
  return m ? m[1] : null;
}
async function loadPlaylist() {
  const id = parsePlaylistId($('#pl')?.value);
  if (!id) return toast('Plak een geldige Spotify-playlistlink.', true);
  const btn = $('#plbtn'); if (btn) { btn.disabled = true; btn.textContent = 'Laden…'; }
  try {
    const meta = await api(`/playlists/${id}?fields=name`).catch(() => ({name: 'Playlist'}));
    const tracks = []; let offset = 0, total = 1;
    while (offset < total) {
      const page = await api(`/playlists/${id}/items?limit=50&offset=${offset}`);
      total = page.total ?? 0;
      for (const it of page.items || []) {
        const t = it.item || it.track;            // 'item' = nieuwe veldnaam (feb 2026)
        if (!t || t.type !== 'track' || it.is_local || !t.id) continue;
        if (tracks.some(x => x.id === t.id)) continue;
        const imgs = t.album?.images || [];
        tracks.push({
          id: t.id, uri: t.uri, title: t.name,
          artist: (t.artists || []).map(a => a.name).join(', '),
          year: parseInt((t.album?.release_date || '').slice(0, 4)) || 0,
          img: (imgs[imgs.length - 1] || {}).url || '', imgL: (imgs[1] || imgs[0] || {}).url || '',
          dur: t.duration_ms || 180000,
        });
      }
      offset += 50; if (!page.next) break;
    }
    if (!tracks.length) throw new Error('Geen nummers gevonden in deze playlist.');
    lib = {source: 'spotify', playlistId: id, name: meta.name || 'Playlist', tracks};
    save(K.lib, lib); toast(`${tracks.length} nummers geladen ✓`); render();
  } catch (e) {
    if (e.status === 403 || e.status === 404) toast('Kan deze playlist niet lezen. Spotify staat alleen playlists toe die jij zelf bezit of waaraan je meewerkt.', true);

/* ---------- afspelen via Spotify Connect ---------- */
let playing = false;
async function play(restart = true) {
  const t = T(game?.current); if (!t) return;
  if (lib.source === 'demo') { if (!play._demo) { play._demo = 1; toast('Demomodus: er speelt geen muziek. Kies gewoon een plek om de flow te testen.'); } return; }
  const dev = load(K.dev, null);
  const pos = rand(Math.min(30000, t.dur * 0.2), Math.min(60000, t.dur * 0.5));
  try {
    if (restart) await api('/me/player/play' + (dev ? '?device_id=' + dev.id : ''), {method: 'PUT', body: {uris: [t.uri], position_ms: pos}});
    else await api('/me/player/play' + (dev ? '?device_id=' + dev.id : ''), {method: 'PUT'});
    playing = true; updateEq();
  } catch (e) {
    playing = false; updateEq();
    if (e.status === 404 || e.reason === 'NO_ACTIVE_DEVICE') { toast('Geen actief Spotify-apparaat. Kies er een.', true); openDevices(); }
    else if (e.status === 403) toast('Afspelen geweigerd. Spotify Premium is nodig voor afspelen.', true);
    else toast('Afspelen mislukt: ' + e.message, true);
  }
}
async function pause() {
  if (lib?.source === 'demo') return;
  const dev = load(K.dev, null);
  try { await api('/me/player/pause' + (dev ? '?device_id=' + dev.id : ''), {method: 'PUT'}); } catch {}
  playing = false; updateEq();
}
function updateEq() { const e = $('.eq'); if (e) e.classList.toggle('off', !playing); const b = $('[data-a=toggle]'); if (b) b.innerHTML = playing ? '⏸ Pauze' : '▶ Afspelen'; }
async function openDevices() {
  const cur = load(K.dev, null);
  modal(`<h2>Afspelen op…</h2><p class="muted small">Muziek speelt via Spotify Connect op je telefoon, laptop of speaker. Zie je niets? Open de Spotify-app, speel kort iets af en tik op Vernieuwen.</p><div id="devs" class="stack"><p class="muted">Zoeken…</p></div>
    <div class="row" style="margin-top:14px"><a class="btn grow" href="spotify:">Open Spotify</a><button class="btn grow" data-a="devices">Vernieuwen</button></div>`);
  try {

    $('#devs').innerHTML = list.length ? list.map(d => `<button class="btn block" data-a="pickdev" data-id="${esc(d.id)}" data-name="${esc(d.name)}" style="justify-content:space-between">

      : '<p class="err">Geen apparaten gevonden.</p>';
  } catch (e) { $('#devs').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

/* =========================================================
   SPELLOGICA
   ========================================================= */
function newGame(names) {
  const deck = shuffle(playable().map(t => t.id));
  if (deck.length < names.length + 5) return toast('Te weinig speelbare nummers voor dit aantal spelers.', true);
  const players = names.map(n => ({name: n, timeline: [deck.pop()], tokens: settings.tokens ? settings.startTokens : 0}));
  game = {players, deck, discard: [], turn: 0, phase: 'handoff', current: null, slot: null, challenges: [], result: null,
          target: settings.target, tokens: settings.tokens, winner: null, guessed: false, round: 1};
  save(K.game, game); ui.screen = 'game'; render();
}
function draw() {
  if (!game.deck.length && game.discard.length) { game.deck = shuffle(game.discard); game.discard = []; }
  return game.deck.pop() || null;
}
const curP = () => game.players[game.turn];
function startTurn() {
  game.current = draw();
  if (!game.current) return endByCount();
  Object.assign(game, {phase: 'listen', slot: null, challenges: [], result: null, guessed: false});
  ui.pendingChallenger = null; save(K.game, game); render(); play(true);
}
function slotOk(tl, slot, y) {
  return (slot === 0 || yearOf(tl[slot - 1]) <= y) && (slot === tl.length || y <= yearOf(tl[slot]));
}
function insertSorted(tl, id) {
  const y = yearOf(id); let i = tl.findIndex(x => yearOf(x) > y); if (i < 0) i = tl.length; tl.splice(i, 0, id); return i;
}
function lockIn() {
  if (game.slot === null) return;
  const others = game.players.some((p, i) => i !== game.turn && p.tokens > 0);
  if (game.tokens && others && game.players[game.turn].timeline.length + 1 > 1) { game.phase = 'challenge'; save(K.game, game); render(); }
  else reveal();
}
function reveal() {
  const p = curP(), y = yearOf(game.current), tl = p.timeline;
  const res = {correct: slotOk(tl, game.slot, y), to: null, chal: []};
  game.challenges.forEach(c => { game.players[c.p].tokens--; res.chal.push({p: c.p, slot: c.slot, ok: slotOk(tl, c.slot, y)}); });
  if (res.correct) { tl.splice(game.slot, 0, game.current); res.to = game.turn; }
  else {
    const win = res.chal.find(c => c.ok);
    if (win) { insertSorted(game.players[win.p].timeline, game.current); res.to = win.p; }
    else game.discard.push(game.current);
  }
  game.result = res; game.phase = 'reveal'; ui.pendingChallenger = null;
  save(K.game, game); render();
  if (res.correct || res.to !== null) burst(18);
}
function nextTurn() {
  const t = game.target;
  const order = [game.turn, ...game.players.map((_, i) => i).filter(i => i !== game.turn)];
  const w = order.find(i => game.players[i].timeline.length >= t);
  if (w !== undefined) { game.winner = w; game.phase = 'win'; save(K.game, game); pause(); render(); confettiRain(); return; }
  game.turn = (game.turn + 1) % game.players.length;
  if (game.turn === 0) game.round++;
  game.phase = 'handoff'; game.current = null; save(K.game, game); pause(); render();
}
function endByCount() {
  let best = 0; game.players.forEach((p, i) => { if (p.timeline.length > game.players[best].timeline.length) best = i; });
  game.winner = best; game.phase = 'win'; save(K.game, game); render(); toast('De stapel is op!'); confettiRain();
}
function skipSong() {
  const p = curP(); if (p.tokens < 1) return;
  p.tokens--; game.discard.push(game.current); game.current = draw();
  if (!game.current) return endByCount();
  game.slot = null; save(K.game, game); render(); play(true); toast('Nieuw nummer!');
}
function buyCard() {
  const p = curP(); if (p.tokens < 3) return;
  const id = draw(); if (!id) return toast('Geen kaartjes meer op de stapel.', true);
  p.tokens -= 3; insertSorted(p.timeline, id);
  if (game.slot !== null) game.slot = null;
  save(K.game, game); render();
  const t = T(id); toast(`Gratis kaartje: ${t.title} (${yearOf(t)})`);
  if (p.timeline.length >= game.target) { game.winner = game.turn; game.phase = 'win'; save(K.game, game); pause(); render(); confettiRain(); }
}

function timelineView(mode) {

  }

  if (game.phase === 'win') {
    const w = game.players[game.winner];
    return `${top}
    <div style="text-align:center;margin:20px 0"><div class="muted">De winnaar is</div><div class="logo" style="font-size:40px;word-break:break-word">${esc(w.name)}</div>
      <p class="muted">${w.timeline.length} kaartjes in ${game.round} rondes</p></div>
    <div class="tl">${w.timeline.map(id => songRow(id)).join('')}</div>
    <div class="bottom"><div class="inner"><button class="btn ghost" data-a="home">Menu</button><button class="btn primary grow" data-a="again">Opnieuw spelen</button></div></div>`;
  }
  return top;
}

/* ---------- modals ---------- */
function modal(html) { $('#sheet').innerHTML = html + `<button class="btn ghost block" data-a="close" style="margin-top:12px">Sluiten</button>`; $('#modal').classList.add('open'); }
function closeModal() { $('#modal').classList.remove('open'); }
function showTimelines() {
  modal(`<h2>Tijdlijnen</h2>${game.players.map((p, i) => `<h3 style="margin-top:16px">${esc(p.name)} · ${p.timeline.length}/${game.target}${game.tokens ? ' · <span class="coin"></span> ' + p.tokens : ''}</h3>
    <div class="tl">${p.timeline.map(id => songRow(id)).join('')}</div>`).join('')}`);
}
function showRules() {
  modal(`<h2>Spelregels</h2><ol class="rules">
    <li>Iedereen begint met één open kaartje op zijn tijdlijn.</li>
    <li>Om de beurt speelt er een nummer. De speler aan de beurt kiest waar het in zijn tijdlijn hoort: ervoor, erna of ertussen.</li>
    <li>Na <b>Vastzetten</b> en <b>Omdraaien</b> zie je titel, artiest en jaar. Klopt de plek? Dan blijft het kaartje liggen. Zo niet, dan is hij weg.</li>
    <li>Zelfde jaar naast elkaar telt als goed.</li>
    <li>Wie als eerste het doel haalt (standaard 10 kaartjes), wint.</li>
    </ol><h3>Met tokens</h3><ol class="rules">
    <li>Iedereen start met 2 tokens (max 5).</li>
    <li>Noem je titel én artiest goed vóór het omdraaien? +1 token (de groep beslist).</li>
    <li>1 token: nummer overslaan.</li>
    <li>1 token: <b>Hitster!</b> roepen en een andere plek kiezen op de tijdlijn van de speler aan de beurt. Zit die fout en jij goed, dan is het kaartje van jou.</li>
    <li>3 tokens: een gratis kaartje, direct goed geplaatst.</li></ol>`);
}

/* ---------- export / import ---------- */
function exportJson() {
  const data = {app: 'hitster-thuis', version: 1, playlistId: lib?.playlistId || null, exported: new Date().toISOString(),
    tracks: (lib?.tracks || []).map(t => ({id: t.id, title: t.title, artist: t.artist, spotifyYear: t.year, year: yearOf(t), excluded: isExcluded(t)}))};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'}));
  a.download = 'hitster-jaartallen.json'; document.body.appendChild(a); a.click(); a.remove();
  toast('Bestand opgeslagen ✓');
}
function importJson(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); let n = 0;
      for (const x of d.tracks || []) {
        if (!T(x.id)) continue;
        setOverride(x.id, {year: x.year ? +x.year : undefined, excluded: !!x.excluded}); n++;
      }
      toast(`${n} kaartjes bijgewerkt ✓`); render();
    } catch { toast('Ongeldig bestand.', true); }
  };
  r.readAsText(file);
}

/* ---------- confetti ---------- */
function burst(n) { for (let i = 0; i < n; i++) spawn(Math.random() * 100, Math.random() * 1.2 + 1.2); }
function confettiRain() { for (let i = 0; i < 90; i++) setTimeout(() => spawn(Math.random() * 100, Math.random() * 2 + 2), i * 30); }
function spawn(x, d) {
  const c = document.createElement('div'); c.className = 'confetti';
  c.style.left = x + 'vw'; c.style.background = ['#ff3d9a', '#00e5ff', '#ffd23f', '#a3ff3d', '#b26bff'][rand(0, 5)];
  c.style.animationDuration = d + 's'; c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
  document.body.appendChild(c); setTimeout(() => c.remove(), d * 1000 + 100);
}

/* =========================================================
   EVENTS
   ========================================================= */
function readNames() { return [...document.querySelectorAll('.pname')].map((el, i) => el.value.trim() || 'Speler ' + (i + 1)); }
const actions = {
  home() { closeModal(); ui.screen = 'home'; render(); window.scrollTo(0, 0); },
  resume() { ui.screen = 'game'; render(); },
  savecid() { const v = $('#cid').value.trim(); if (!v) return; save(K.cid, v); render(); },
  resetcid() { del(K.cid); del(K.auth); render(); },
  login, logout, loadpl: loadPlaylist, demo: loadDemo,
  library() { ui.screen = 'library'; render(); window.scrollTo(0, 0); },
  libf(d) { ui.libFilter = d.f; render(); },
  export: exportJson,
  rules: showRules, close: closeModal, timelines: showTimelines,
  devices: openDevices,
  pickdev(d) { save(K.dev, {id: d.id, name: d.name}); closeModal(); toast('Speelt af op ' + d.name); if (ui.screen === 'setup') render(); },
  setup() { ui.screen = 'setup'; render(); window.scrollTo(0, 0); },
  addname() { const n = readNames(); n.push('Speler ' + (n.length + 1)); save(K.names, n); render(); },
  rmname(d) { const n = readNames(); n.splice(+d.i, 1); save(K.names, n); render(); },
  tgt(d) { save(K.names, readNames()); settings.target = Math.max(3, Math.min(30, settings.target + +d.d)); save(K.set, settings); render(); },
  start() {
    const names = readNames(); save(K.names, names);
    settings.tokens = $('#tok').checked; save(K.set, settings); newGame(names);
  },
  startturn: startTurn,
  toggle() { playing ? pause() : play(false); },
  replay() { play(true); },
  skip: skipSong, buy: buyCard,
  slot(d) { game.slot = +d.i; save(K.game, game); render(); },
  lock: lockIn,
  unlock() { game.phase = 'listen'; game.challenges = []; ui.pendingChallenger = null; save(K.game, game); render(); },
  chal(d) { ui.pendingChallenger = +d.i; render(); },
  chalcancel() { ui.pendingChallenger = null; render(); },
  chalslot(d) { game.challenges.push({p: ui.pendingChallenger, slot: +d.i}); ui.pendingChallenger = null; save(K.game, game); render(); },
  reveal,
  guessed() { const p = curP(); if (game.guessed || p.tokens >= 5) return; p.tokens++; game.guessed = true; save(K.game, game); render(); },
  next: nextTurn,
  again() { const names = game.players.map(p => p.name); newGame(names); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = actions[el.dataset.a]; if (!a) return;
  if (el.tagName === 'A') e.preventDefault();
  a(el.dataset, el);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('input', e => {
  if (e.target.id === 'libq') { ui.libQuery = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#libq'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.c === 'year') { const v = parseInt(el.value); setOverride(el.dataset.id, {year: v >= 1900 && v <= 2100 ? v : undefined}); el.classList.toggle('changed', !!ov[el.dataset.id]?.year); }
  if (el.dataset.c === 'incl') { setOverride(el.dataset.id, {excluded: !el.checked}); el.closest('.lib-row').classList.toggle('off', !el.checked); }
  if (el.id === 'imp' && el.files[0]) importJson(el.files[0]);
  if (el.id === 'tok') { settings.tokens = el.checked; save(K.set, settings); }
  if (el.classList.contains('pname')) save(K.names, readNames());
});

/* ---------- start ---------- */
(async () => {
  await handleCallback();
  if (game && game.phase !== 'win' && game.phase !== 'handoff') ui.screen = 'game';
  render();
  if (loggedIn()) { try { me = await api('/me'); render(); } catch (e) { if (/opnieuw/.test(e.message)) { toast(e.message, true); render(); } } }
})();
</script>
